# Nginx config for TrippyJiffy + Leads Extractor
#
# Setup:
#   1. Clone to /var/www/trippyjiffy and run: npm run setup:production
#   2. sudo cp deploy/nginx/trippyjiffy.conf /etc/nginx/sites-available/trippyjiffy
#   3. sudo ln -sf /etc/nginx/sites-available/trippyjiffy /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name trippyjiffy.com www.trippyjiffy.com;

    client_max_body_size 20M;

    root /var/www/trippyjiffy/frontend-dist;
    index index.html;

    # TrippyJiffy API
    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5005/uploads/;
        proxy_set_header Host $host;
    }

    # Leads Extractor API
    location /leads-api/ {
        proxy_pass http://127.0.0.1:5006/leads-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Leads Extractor frontend
    location /leads/ {
        alias /var/www/trippyjiffy/leads-dist/;
        try_files $uri $uri/ /leads/index.html;
    }

    # TrippyJiffy frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
