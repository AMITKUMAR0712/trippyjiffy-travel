# FULL Nginx config for trippyjiffy.com (HTTP + HTTPS)
# Paste into: sudo nano /etc/nginx/sites-enabled/trippyjiffy
#
# Before reload, on server run:
#   cd /var/www/trippyjiffy
#   npm run build:all
#   ls -la leads-dist/index.html
#   ls -la frontend-dist/index.html
#
# Then:
#   sudo nginx -t
#   sudo systemctl reload nginx

# -------- HTTP (redirect to HTTPS) --------
server {
    listen 80;
    server_name trippyjiffy.com www.trippyjiffy.com;
    return 301 https://$host$request_uri;
}

# -------- HTTPS (main) --------
server {
    listen 443 ssl http2;
    server_name trippyjiffy.com www.trippyjiffy.com;

    # SSL — certbot usually adds these lines; keep your existing paths if different
    ssl_certificate /etc/letsencrypt/live/trippyjiffy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trippyjiffy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    root /var/www/trippyjiffy/frontend-dist;
    index index.html;

    # TrippyJiffy API
    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5005/uploads/;
        proxy_set_header Host $host;
    }

    # Leads Extractor API
    location /leads-api/ {
        proxy_pass http://127.0.0.1:5006/leads-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # /leads -> /leads/
    location = /leads {
        return 301 /leads/;
    }

    # Leads frontend SPA — MUST be before location /
    location ^~ /leads/ {
        alias /var/www/trippyjiffy/leads-dist/;
        try_files $uri $uri/ @leads_spa;
    }

    location @leads_spa {
        root /var/www/trippyjiffy/leads-dist;
        rewrite ^ /index.html break;
    }

    # TrippyJiffy frontend SPA — keep last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
