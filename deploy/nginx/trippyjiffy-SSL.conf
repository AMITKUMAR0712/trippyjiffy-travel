# TrippyJiffy nginx + SSL (fixes "Not secure")
#
# On VPS:
#   cd /var/www/second-project/trippyjiffy-travel
#   git pull
#   ln -sfn "Frontend (8)/Frontend/dist" frontend-dist
#   sudo cp deploy/nginx/trippyjiffy-SSL.conf /etc/nginx/sites-available/trippyjiffy
#   sudo certbot install --cert-name trippyjiffy.com --nginx
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -I https://trippyjiffy.com

# HTTP -> HTTPS (both domains)
server {
    listen 80;
    listen [::]:80;
    server_name trippyjiffy.com www.trippyjiffy.com;
    return 301 https://trippyjiffy.com$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trippyjiffy.com www.trippyjiffy.com;

    ssl_certificate /etc/letsencrypt/live/trippyjiffy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trippyjiffy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    root /var/www/second-project/trippyjiffy-travel/frontend-dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5005/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
