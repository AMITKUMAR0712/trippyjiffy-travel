# SAFE TrippyJiffy-only nginx — does NOT touch other domains
# Server path: /var/www/second-project/trippyjiffy-travel
#
# Apply on VPS:
#   sudo cp /etc/nginx/sites-available/trippyjiffy /etc/nginx/sites-available/trippyjiffy.broken-backup
#   sudo cp deploy/nginx/trippyjiffy-SAFE-ONLY.conf /etc/nginx/sites-available/trippyjiffy
#   sudo nginx -t && sudo systemctl reload nginx
#   pm2 restart trippy

server {
    listen 80;
    server_name trippyjiffy.com www.trippyjiffy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trippyjiffy.com www.trippyjiffy.com;

    ssl_certificate /etc/letsencrypt/live/trippyjiffy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trippyjiffy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    root "/var/www/second-project/trippyjiffy-travel/Frontend (8)/Frontend/dist";
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5005/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
